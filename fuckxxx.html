<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title id="title">fuckxxx</title>
    <style>
		.rotate-grow {
			display: inline-block;
			animation: rotateAndGrow 2s infinite alternate ease-in-out;
            color: black;
            size: 1000px;
            position: fixed;
            left: 40%;
            top: 40%;
		}
		
		@keyframes rotateAndGrow {
			0% {
				transform: rotate(-5deg) scale(1);
			}
			50% {
				transform: rotate(5deg) scale(100);
			}
			100% {
				transform: rotate(-5deg) scale(1);
			}
		}
	</style>
</head>
<body>
    <div id="inputForm">
        <input type="text" id="input">
        <button onclick="input_over()">确定</button><br>
        <p><button onclick="set_input('XXX你M掉啦')">XXX你M掉啦</button></p>
        <p><button onclick="set_input('XXX别动我电脑')">XXX别动我电脑</button></p>
    </div>
    <div id="app"></div>
    <script>
        const inputText = document.getElementById("input");
        const inputForm = document.getElementById("inputForm");
        const app = document.getElementById("app");
        const title = document.getElementById("title");
		set_input("何然你M飞了");
		input_over();
        function input_over() {
            const text = inputText.value;
            inputForm.innerHTML = "";
            app.innerHTML = `<p class="rotate-grow">${text}</p>`;
            title.innerHTML = text;
        }
        function set_input(str) {
            inputText.value = str;
        }
    </script>
</body>
</html>
