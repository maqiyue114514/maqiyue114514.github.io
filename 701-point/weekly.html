<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>701积分系统 · 本周报告</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./supabase-js.js"></script>
</head>
<body>
    <div id="auth-overlay">
        <div class="auth-box">
            <h2 class="auth-title">701积分系统</h2>
            <p class="auth-subtitle">请输入访问密码</p>
            <input type="password" id="password-input" class="auth-input" placeholder="密码" autocomplete="current-password">
            <button class="auth-btn" onclick="tryLogin()">进入</button>
            <p id="auth-error" class="auth-error"></p>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载中…</div>
    </div>

    <div id="top-bar"></div>

    <h1 class="title">本周报告</h1>
    <p id="week-range"></p>

    <div class="section-header">
        <h3>本周加分榜</h3>
    </div>
    <div id="plus-ranking-list">
        <table>
            <thead>
                <tr>
                    <th>排名</th>
                    <th>学号</th>
                    <th>姓名</th>
                    <th>本周加分</th>
                </tr>
            </thead>
            <tbody id="plus-ranking-table"></tbody>
        </table>
    </div>

    <div class="section-header">
        <h3>本周扣分榜</h3>
    </div>
    <div id="minus-ranking-list">
        <table>
            <thead>
                <tr>
                    <th>排名</th>
                    <th>学号</th>
                    <th>姓名</th>
                    <th>本周扣分</th>
                </tr>
            </thead>
            <tbody id="minus-ranking-table"></tbody>
        </table>
    </div>

    <a class="nav-link" href="./index.html">← 返回积分系统</a>
    <button onclick="logout()">退出登录</button>

    <script src="./server.js"></script>
    <script src="./weekly.js"></script>
</body>
</html>
